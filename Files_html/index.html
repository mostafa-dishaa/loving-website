<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loving | Website</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../Files_css/style.css">
    <!-- JavaScript -->
</head>

<body>
    <main class="main-container">
<!-- Right QR Code -->
        <div class="qr-card">
            <h4>امسحي الكود</h4>
            <div id="qr-left"></div>
            <p>افتحي الحكاية من هنا</p>

            <button class="qr-download-btn" onclick="downloadQR('qr-left')">
                <i class="fa-solid fa-download"></i>
                تحميل QR
            </button>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Envelope -->
            <div class="envelope">
                <div class="letter">
                    <span class="couple-names">
                        مصطفى <span>&</span> حبيبه
                    </span>
                </div>

                <div class="envelope-content"></div>

                <div class="envelope-seal">
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <!-- Title -->
            <h3 class="couple-title">مصطفى & حبيبه</h3>
            <!-- Open Letter Button -->
            <a href="memories.html" class="open-letter-btn">
                <span>افتحي الحكاية</span>
                <i class="fa-solid fa-envelope-open-text"></i>
            </a>

            <!-- Description -->
            <p class="description">
                اضغطي على الزرار علشان تفتحي الحكاية
            </p>
        </div>
    </main>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>

    /* ==============================
       3. Generate QR Code
    ============================== */
        const websiteURL = "https://mostafa-dishaa.github.io/loving-website/";

        new QRCode(document.getElementById("qr-left"), {
            text: websiteURL,
            width: 109,
            height: 109,
            colorDark: "#090909",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        /* ==============================
           4. Download QR Code
        ============================== */
        function downloadQR(qrId) {

            const qrContainer = document.getElementById(qrId);

            const qrCanvas = qrContainer.querySelector("canvas");
            const qrImage = qrContainer.querySelector("img");

            let imageURL;
            if (qrCanvas) {
                imageURL = qrCanvas.toDataURL("image/png");
            }
            else if (qrImage) {
                imageURL = qrImage.src;
            }
            else {
                alert("QR Code is not ready yet!");
                return;
            }

            const downloadLink = document.createElement("a");
            downloadLink.href = imageURL;
            downloadLink.download = "Loving-Website-QR.png";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
</script>
</body>

</html>
